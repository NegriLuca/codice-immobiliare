[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codice-immobiliare"
version = "1.0.0"
description = "Rome rental-yield scanner: listings + short-let calendars"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "numpy>=1.24", "openpyxl>=3.1"]

[project.optional-dependencies]
geo = ["geopandas", "shapely", "osmnx", "plotly", "matplotlib"]
scraping = ["selenium", "undetected-chromedriver", "webdriver-manager", "beautifulsoup4", "requests", "tqdm"]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM"]
ignore = ["E501"]
